<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2a30"/><stop offset="1" stop-color="#101012"/>
    </linearGradient>
    <!-- userSpaceOnUse so straight lines (zero-width bounding boxes) still get the gradient -->
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="280" y1="220" x2="760" y2="820">
      <stop offset="0" stop-color="#5ac8fa"/><stop offset="0.5" stop-color="#0a84ff"/><stop offset="1" stop-color="#bf5af2"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6"/>
  <!-- a note tree: root, trunk, three branches, each ending in a page -->
  <g filter="url(#sh)">
    <path d="M312 262 V 772 M312 430 H 480 M312 600 H 480 M312 772 H 480"
          fill="none" stroke="url(#ink)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="312" cy="262" r="70" fill="url(#ink)"/>
    <g fill="#ffffff">
      <rect x="500" y="362" width="250" height="136" rx="34"/>
      <rect x="500" y="532" width="250" height="136" rx="34"/>
      <rect x="500" y="704" width="250" height="136" rx="34"/>
    </g>
    <g stroke="#1a1a1f" stroke-width="18" stroke-linecap="round" opacity="0.85">
      <path d="M548 410 h118 M548 450 h78"/>
      <path d="M548 580 h118 M548 620 h78"/>
      <path d="M548 752 h118 M548 792 h78"/>
    </g>
  </g>
</svg>
